# Local CLI label only; the existing hosted project is selected with supabase link --project-ref.
project_id = "everstride-local"
[auth]
enable_anonymous_sign_ins = true
[functions.adventure-command]
verify_jwt = true
[functions.camera-pair]
# Capability-protected, isolated camera pairing; never authenticates a game save.
verify_jwt = false

[functions.tower-command]
verify_jwt = false
