name: Deploy Battle Tower

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Check public backend configuration
        run: |
          if [ -z "$VITE_SUPABASE_URL" ] || [ -z "$VITE_SUPABASE_PUBLISHABLE_KEY" ]; then
            echo 'Configure VITE_SUPABASE_URL and VITE_SUPABASE_PUBLISHABLE_KEY in repository Actions secrets.'
            exit 1
          fi
      - run: npm ci
      - run: npm test
      - run: npm run check:shared
      - name: Check database contracts locally
        run: |
          node supabase/tests/tower.mjs
          node supabase/tests/platform.mjs
      - uses: actions/configure-pages@v5
      - name: Build for the GitHub Pages subdirectory
        run: |
          npx tsc -b
          npx vite build --base "/${GITHUB_REPOSITORY#*/}/"
          node scripts/build-offline.mjs
          touch dist/.nojekyll
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
